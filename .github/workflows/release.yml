name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      # Optional secrets. When present these enable Developer-ID signing +
      # notarization (so users won't see a Gatekeeper warning) and Sparkle
      # update signing. When absent, the workflow still produces a valid
      # release with ad-hoc signing only.
      APPLE_DEVELOPER_CERT_B64: ${{ secrets.APPLE_DEVELOPER_CERT_B64 }}
      APPLE_DEVELOPER_CERT_PASS: ${{ secrets.APPLE_DEVELOPER_CERT_PASS }}
      APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
      APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
      APPLE_NOTARY_PASS: ${{ secrets.APPLE_NOTARY_PASS }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Developer ID certificate (when available)
        if: env.APPLE_DEVELOPER_CERT_B64 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "$APPLE_DEVELOPER_CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_CERT_PASS" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

      - name: Build CLI + app
        run: ./Scripts/build-app.sh

      - name: Re-sign app with Developer ID (when available)
        if: env.APPLE_DEVELOPER_CERT_B64 != ''
        run: |
          IDENTITY="Developer ID Application: ${APPLE_DEVELOPER_TEAM_ID}"
          codesign --force --deep --options runtime --timestamp \
            --sign "$IDENTITY" build/Aspace.app/Contents/Frameworks/Sparkle.framework
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" build/Aspace.app

      - name: Package CLI tarball
        run: |
          mkdir -p dist
          BIN_PATH="$(swift build -c release --product aspace --show-bin-path)/aspace"
          tar -czf "dist/aspace-${VERSION}-darwin-arm64.tar.gz" \
            -C "$(dirname "$BIN_PATH")" aspace

      - name: Package .app zip
        run: |
          ditto -ck --keepParent --sequesterRsrc build/Aspace.app \
            "dist/Aspace-${VERSION}.app.zip"

      - name: Notarize and staple (when credentials available)
        if: env.APPLE_NOTARY_USER != ''
        run: |
          xcrun notarytool submit "dist/Aspace-${VERSION}.app.zip" \
            --apple-id "$APPLE_NOTARY_USER" \
            --password "$APPLE_NOTARY_PASS" \
            --team-id "$APPLE_DEVELOPER_TEAM_ID" \
            --wait
          rm -rf build/staple-work && mkdir build/staple-work
          ditto -xk "dist/Aspace-${VERSION}.app.zip" build/staple-work
          xcrun stapler staple "build/staple-work/Aspace.app"
          rm "dist/Aspace-${VERSION}.app.zip"
          ditto -ck --keepParent --sequesterRsrc \
            "build/staple-work/Aspace.app" \
            "dist/Aspace-${VERSION}.app.zip"

      - name: Sign update zip with Sparkle (when key available)
        if: env.SPARKLE_PRIVATE_KEY != ''
        id: sparkle
        run: |
          SPARKLE_VERSION="2.6.4"
          curl -fL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle && tar -xJf /tmp/sparkle.tar.xz -C /tmp/sparkle
          PRIV_KEY_FILE="$(mktemp)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$PRIV_KEY_FILE"
          SIG_OUTPUT="$(/tmp/sparkle/bin/sign_update \
            "dist/Aspace-${VERSION}.app.zip" -f "$PRIV_KEY_FILE")"
          {
            echo 'sig<<EOF_SIG'
            echo "$SIG_OUTPUT"
            echo 'EOF_SIG'
          } >> "$GITHUB_OUTPUT"

      - name: Append entry to appcast.xml (when Sparkle key available)
        if: env.SPARKLE_PRIVATE_KEY != ''
        env:
          SIG_OUTPUT: ${{ steps.sparkle.outputs.sig }}
        run: |
          export ZIP_URL="https://github.com/${REPO}/releases/download/${VERSION}/Aspace-${VERSION}.app.zip"
          python3 - <<'PY'
          import os, datetime, pathlib
          version = os.environ["VERSION"]
          zip_url = os.environ["ZIP_URL"]
          sig = os.environ["SIG_OUTPUT"].strip()
          pub_date = datetime.datetime.utcnow().strftime("%a, %d %b %Y %H:%M:%S +0000")
          version_num = version.lstrip("v")

          item = (
              "        <item>\n"
              f"            <title>{version}</title>\n"
              f"            <pubDate>{pub_date}</pubDate>\n"
              f"            <sparkle:version>{version_num}</sparkle:version>\n"
              f"            <sparkle:shortVersionString>{version_num}</sparkle:shortVersionString>\n"
              f"            <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>\n"
              f'            <enclosure url="{zip_url}" type="application/octet-stream" {sig} />\n'
              "        </item>\n"
          )
          path = pathlib.Path("appcast.xml")
          src = path.read_text()
          src = src.replace("</channel>", item + "    </channel>")
          path.write_text(src)
          PY

      - name: Compute checksums
        working-directory: dist
        run: shasum -a 256 * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aspace-${{ github.ref_name }}-darwin-arm64.tar.gz
            dist/Aspace-${{ github.ref_name }}.app.zip
            dist/SHA256SUMS
          generate_release_notes: true

      - name: Commit and push updated appcast.xml (when Sparkle key available)
        if: env.SPARKLE_PRIVATE_KEY != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet appcast.xml; then
            echo "No appcast changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore(appcast): publish ${VERSION}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}" \
            HEAD:main
